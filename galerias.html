<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galerías - Mi Restaurante</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f5f5f5;
        }
        
        nav {
            background-color: #333;
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        nav a {
            color: white;
            text-decoration: none;
            margin-right: 2rem;
            font-size: 1.1rem;
            transition: color 0.3s;
        }
        
        nav a:hover {
            color: #ff9800;
        }
        
        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 2rem;
        }
        
        .galeria {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
        }
        
        .foto {
            background-color: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }
        
        .foto:hover {
            transform: scale(1.05);
        }
        
        .foto img {
            width: 100%;
            height: 250px;
            object-fit: cover;
        }
        
        .foto-titulo {
            padding: 1rem;
            text-align: center;
            color: #333;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <nav>
        <a href="index.html">Inicio</a>
        <a href="galerias.html">Galerías</a>
    </nav>
    
    <div class="container">
        <h1>Galerías de nuestro Restaurante</h1>
        
        <div class="galeria">
            <div class="foto">
                <img src="https://via.placeholder.com/400x300?text=Plato+1" alt="Plato especial">
                <div class="foto-titulo">Plato Especial</div>
            </div>
            
            <div class="foto">
                <img src="https://via.placeholder.com/400x300?text=Ambiente" alt="Ambiente del local">
                <div class="foto-titulo">Ambiente</div>
            </div>
            
            <div class="foto">
                <img src="https://via.placeholder.com/400x300?text=Plato+2" alt="Otra creación">
                <div class="foto-titulo">Otra Creación</div>
            </div>
            
            <div class="foto">
                <img src="https://via.placeholder.com/400x300?text=Terraza" alt="Terraza">
                <div class="foto-titulo">Terraza</div>
            </div>
            
            <div class="foto">
                <img src="https://via.placeholder.com/400x300?text=Postre" alt="Postres">
                <div class="foto-titulo">Postres</div>
            </div>
            
            <div class="foto">
                <img src="https://via.placeholder.com/400x300?text=Bebidas" alt="Bebidas">
                <div class="foto-titulo">Bebidas Especiales</div>
            </div>
        </div>
    </div>
</body>
</html>
